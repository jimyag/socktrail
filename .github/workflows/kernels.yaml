name: Kernels

# Boots the distribution kernels of test/vm/kernels.txt and runs the probes'
# root tests and a snapshot in each, one job per kernel. Weekly, since
# distributions update their kernels, and whenever the probes or the VM
# tooling change.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
  push:
    branches: [main]
    paths:
      - "internal/**/*.bpf.c"
      - "test/vm/**"
      - ".github/workflows/kernels.yaml"

permissions:
  contents: read

concurrency:
  group: kernels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      kernels: ${{ steps.list.outputs.kernels }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          kernels=$(jq -Rnc '[inputs | select(test("^\\s*(#|$)") | not) | [splits(" +")] | {name: .[0], arch: .[1]}]' test/vm/kernels.txt)
          echo "kernels=$kernels" >>"$GITHUB_OUTPUT"

  kernel:
    name: ${{ matrix.arch }} ${{ matrix.name }}
    needs: list
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.kernels) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # arm64 is emulated: a few minutes a kernel.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Prepare
        id: prepare
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y cpio ${{ matrix.arch == 'amd64' && 'qemu-system-x86' || 'qemu-system-arm' }}
          echo "week=$(date +%G-%V)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/socktrail-vm
          key: vm-${{ matrix.arch }}-${{ matrix.name }}-${{ steps.prepare.outputs.week }}
          restore-keys: vm-${{ matrix.arch }}-${{ matrix.name }}-
      - name: Boot the kernel
        env:
          VM_OUT: ${{ runner.temp }}/vm
        run: test/vm/run.sh ${{ matrix.arch }} ${{ matrix.name }} | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vm-log-${{ matrix.arch }}-${{ matrix.name }}
          path: ${{ runner.temp }}/vm/*.log
