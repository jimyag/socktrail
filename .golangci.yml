version: "2"

run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod

linters:
  default: standard
  settings:
    gocritic:
      # A switch adds no value to these short, mutually exclusive UI branches.
      disabled-checks: [ifElseChain]
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - misspell
    - modernize
    - nilerr
    - nilnesserr
    - nolintlint
    - unconvert
    - unparam
    - usetesting
    - wastedassign
  exclusions:
    warn-unused: true
    rules:
      # Staticcheck's QF checks are optional rewrites, not correctness checks.
      - linters: [staticcheck]
        text: '^QF'
      - path: _test\.go
        linters:
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
