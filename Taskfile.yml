version: '3'

vars:
  GIT_TAG:
    sh: git describe --tags --always --dirty
  BUILD_TIME:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ

tasks:
  default:
    desc: Build socktrail
    deps: [build]

  generate-stream:
    desc: Regenerate the MessagePack streaming codecs
    cmds:
      - go generate ./internal/app ./internal/domain ./internal/geoip

  build:
    desc: Build a static Linux binary
    env:
      CGO_ENABLED: '0'
    cmds:
      - >-
        go build -trimpath -buildvcs=true
        -ldflags="-s -w -X github.com/jimmicro/version.GitTag={{.GIT_TAG}} -X github.com/jimmicro/version.BuildTime={{.BUILD_TIME}}"
        -o socktrail .

  install:
    desc: Install socktrail with capture and eBPF capabilities
    deps: [build]
    cmds:
      - sudo install -o root -g "$(id -gn)" -m 0750 ./socktrail /usr/local/bin/socktrail
      - |
        # cap_sys_resource lets socktrail raise the eBPF memlock rlimit;
        # required on 5.10 and still needed by some newer kernels (e.g.
        # Debian 13 with 6.12), so grant it unconditionally.
        caps=cap_bpf,cap_perfmon,cap_net_raw,cap_net_admin,cap_sys_resource
        sudo setcap "$caps+ep" /usr/local/bin/socktrail
      - getcap /usr/local/bin/socktrail
      - ./socktrail --man | sudo install -D -m 0644 /dev/stdin /usr/local/share/man/man1/socktrail.1
