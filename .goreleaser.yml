version: 2

project_name: socktrail

builds:
  - id: socktrail
    main: .
    binary: socktrail
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=true
    ldflags:
      - -s -w
      - -X github.com/jimmicro/version.GitTag={{ .Tag }}
      - -X github.com/jimmicro/version.BuildTime={{ .Date }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: jimyag
    name: socktrail

changelog:
  use: github-native
